name: Release

on:
  push:
    tags:
      - 'v*'
  # Covers a release published from the GitHub UI on a tag that already exists:
  # no tag is pushed in that case, so the push trigger above never fires.
  release:
    types: [published]

permissions:
  contents: write

# Creating a release in the UI with a NEW tag fires both triggers at once.
# Queue them instead of letting two jobs race on the same upload.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            echo "Bump package.json or retag before releasing."
            exit 1
          fi
          echo "Releasing version ${PKG_VERSION}."

      - name: Stage plugin folder
        run: |
          mkdir -p dist/camunda-navigator
          cp -r index.js menu utils package.json README.md LICENSE menu.png dist/camunda-navigator/

      - name: Sanity check the staged plugin
        run: |
          test -f dist/camunda-navigator/index.js
          for file in dist/camunda-navigator/index.js \
                      dist/camunda-navigator/menu/menu.js \
                      dist/camunda-navigator/utils/*.js; do
            node --check "$file"
          done
          echo "Staged files:"
          find dist/camunda-navigator -type f | sort

      - name: Create zip
        run: |
          cd dist
          zip -r ../camunda-navigator.zip camunda-navigator

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, attaching the zip to it."
            gh release upload "${GITHUB_REF_NAME}" camunda-navigator.zip --clobber
          else
            echo "Creating release ${GITHUB_REF_NAME}."
            gh release create "${GITHUB_REF_NAME}" camunda-navigator.zip \
              --title "${GITHUB_REF_NAME}" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
